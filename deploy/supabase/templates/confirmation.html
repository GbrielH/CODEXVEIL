<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:32px 16px;background:#171719;color:#E7E4DD;font-family:Georgia,'Times New Roman',serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;">
      <tr>
        <td style="padding:32px;border:1px solid #3A3A40;border-radius:10px;background:#1C1C1F;">
          <p style="margin:0 0 8px;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:#B8B8BC;">Codexveil</p>
          <h1 style="margin:0 0 16px;font-size:24px;color:#E4D8BD;">Confirme seu e-mail</h1>
          <p style="margin:0 0 24px;line-height:1.6;">
            Seu grimório está quase pronto. Confirme este endereço para começar a organizar suas campanhas.
          </p>
          <p style="margin:0 0 24px;">
            <a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=email&next=/painel"
               style="display:inline-block;padding:12px 20px;border-radius:6px;background:#571F2B;color:#E4D8BD;text-decoration:none;font-family:Arial,sans-serif;font-weight:bold;">
              Confirmar e-mail
            </a>
          </p>
          <p style="margin:0;font-size:13px;line-height:1.6;color:#9A9AA0;">
            Se você não criou uma conta no Codexveil, ignore esta mensagem.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
