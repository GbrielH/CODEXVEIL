# Atualiza o app Android a cada push em `main` (EAS Workflows).
#
# 1. Calcula o fingerprint do código nativo.
# 2. Procura um APK de preview com o mesmo fingerprint.
# 3. Se existir: publica uma atualização OTA no canal `preview` (os aparelhos baixam ao abrir).
#    Se não existir (mudou algo nativo, como uma dependência ou o app.config): gera um APK novo.
#
# Requer o repositório ligado ao projeto em expo.dev → Project settings → GitHub, com
# "Base directory" = apps/mobile. Veja docs/DEPLOY.md.
name: Atualizar app (preview)

on:
  push:
    branches: ['main']

jobs:
  fingerprint:
    name: Fingerprint do código nativo
    type: fingerprint
    environment: preview

  get_android_build:
    name: Procurar APK compatível
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  build_android:
    name: Gerar APK novo (mudança nativa)
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: preview

  update_android:
    name: Publicar atualização OTA
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    environment: preview
    params:
      platform: android
      channel: preview
